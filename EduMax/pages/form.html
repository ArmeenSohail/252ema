	<body>
		<!-- Fixed-width container. This container's max-width will change at different breakpoints -->

			<header class="header">
				<!--header content to go here-->
				<!-- Row 1 -->

							>Login</a
						>
					</div>
					<!-- Row 2 -->
					<div class="row g-0 bg-dark">
						<div class="col">
							<nav class="navbar navbar-expand-lg p-2" data-bs-theme="dark">
								<button
									class="navbar-toggler"
									type="button"
									data-bs-toggle="collapse"
									data-bs-target="#navbarNav"
									aria-controls="navbarNav"
									aria-expanded="false"
									aria-label="Toggle navigation"
								>
									<span class="navbar-toggler-icon"></span>
								</button>
								<div class="collapse navbar-collapse" id="navbarNav">
									<div class="navbar-nav">
										<!-- primary navigation -->
										<a class="nav-link" href="../index.html">Home</a>
										<a class="nav-link" href="./placeholder.html">Catalogue</a>
										<a class="nav-link" href="./placeholder.html">Membership</a>
										<a class="nav-link" href="./placeholder.html">Login</a>
									</div>
								</div>
							</nav>
						</div>
						<div class="col-md-3">
							<!-- search box -->
							<form class="d-flex p-2" id="search" role="search">
								<input
									class="form-control me-2"
									type="search"
									placeholder="Search"
									aria-label="search"
								/>
							</form>
						</div>
					</div>
				</div>
			</header>
			<!-- Row 3 -->
			<div class="row row mt-2 ms-0">
				<div class="col">
					<nav aria-label="breadcrumb">
						<!-- breadcrumbs -->
						<ol class="breadcrumb">
							<li class="breadcrumb-item active" aria-current="page">
								> Home > Announcements > Edit Announcement
							</li>
						</ol>
					</nav>
				</div>
			</div>
			<!-- page-specific content in sections -->
			<main>
				<!-- Row 4 -->
				<div class="row">
					<div class="container col">
						<section>
							<h2>EDIT ANNOUNCEMENT</h2>
							<br />
						</section>
						<form
							action="https://students.open.ac.uk/mct/tm252/reflect/reflect.php"
							method="POST"
						>
							<!-- Subject line field -->
							<div class="form-row">
								<div class="form-group col">
									<label for="sLineInput">*Subject line (max 5 words):</label>
									<input
										class="form-control"
										required
										type="text"
										id="sLineInput"
										placeholder="Subject line"
										value="(Spider) Web Development Day"
									/>
								</div>

								<!-- Sender's name field -->
								<div class="form-group col">
									<label for="sNameInput">*Sender's name:</label><br />
									<input
										class="form-control"
										required
										type="text"
										id="sNameInput"
										name="senderName"
										placeholder="Sender's name"
										value="Peter Parker"
									/><br />
								</div>

								<!-- Sender's role field -->
								<div class="form-group col">
									<label for="sRoleInput">*Sender's role:</label><br />
									<input
										class="form-control"
										required
										type="text"
										id="sRoleInput"
										name="senderRole"
										placeholder="Sender's role"
										value="Friendly neighbour"
									/><br />
								</div>
							</div>

							<!-- Atttachment field -->
							<div class="form-row">
								<div class="form-group col-md-3">
									<label for="attachmentInput">Attachment (optional):</label
									><br />
									<input
										class="form-control"
										type="file"
										id="attachmentInput"
										name="attachment"
									/><br />
								</div>

								<!-- Date and time field -->
								<div class="form-group col-md-5">
									<label for="dateTimeInput">*Date and time:</label><br />
									<input
										class="form-control"
										required
										type="datetime-local"
										id="dateTimeInput"
										name="dateTime"
									/>
								</div>

								<!-- Priorities field -->
								<div id="priorities">
									<div class="form-group col">
										<fieldset>
											<label>*Priority:</label>
											<br />

											<input
												type="radio"
												class="btn-check"
												name="priority"
												id="highPriority"
												checked
											/>
											<label
												class="btn btn-outline-secondary"
												for="highPriority"
												>High</label
											>

											<input
												type="radio"
												class="btn-check"
												name="priority"
												id="normalPriority"
												checked
											/>
											<label
												class="btn btn-outline-secondary"
												for="normalPriority"
												>Normal</label
											>

											<input
												type="radio"
												class="btn-check"
												name="priority"
												id="lowPriority"
												checked
											/>
											<label class="btn btn-outline-secondary" for="lowPriority"
												>Low</label
											>
										</fieldset>
									</div>
								</div>
							</div>

							<!-- Content field -->
							<div class="form-row">
								<div class="form-group col">
									<label for="contentInput">*Content:</label>
									<textarea
										class="form-control"
										required
										id="contentInput"
										placeholder="Announcement content"
									>
Learn how to sling webs (and websites) like Spider-Man!</textarea
									>
								</div>
							</div>

							<!-- Hidden field -->
							<input
								type="hidden"
								id="itemID"
								name="item_ID"
								value="30001000-5000-654321fedcba"
							/>

							<!-- Submit button -->
							<div class="form-row">
								<div class="col">
									<input
										type="submit"
										class="btn btn-dark"
										id="submit"
										value="Submit"
									/>
								</div>
							</div>
						</form>
					</div>
				</div>
				<br />
			</main>

				<!-- Row 5 -->
