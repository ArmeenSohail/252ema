<!doctype html>
<html lang="en">
  <head>
    <title>EduMax - template</title>
    <!-- Edit for each new page created from this template -->
    <meta name="author" content="TM252 Module Team" />
    <meta
      name="description"
      content="An online learning resource by students for students"
    />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/bootstrap.min.css" />
    <!-- Bootstrap stylesheet -->
    <link rel="stylesheet" href="../css/custom.css" />
    <!-- Custom stylesheet - linked after Bootstrap so that entries here take precedence and override Bootstrap's style -->
  </head>
  <body>
    <!-- Fixed-width container. This container's max-width will change at different breakpoints -->
    <div class="container">
      <header class="header">
        <!--header content to go here-->
        <!-- Row 1 -->
        <div class="row">
          <div class="col">
            <!-- logo -->
            <img
              src="../images/EduMax_logo.png"
              alt="EduMax logo"
              class="img-fluid"
            />
          </div>
          <div class="col">
            <!-- site name -->
            <h1 class="header">EduMax</h1>
          </div>
          <div class="col text-end">
            <!-- login button -->
            <a
              class="btn btn-primary m-2"
              href="./registration.html"
              role="button"
              >Login</a
            >
          </div>
        </div>
        <!-- Row 2 -->
        <div class="row g-0 bg-dark">
          <div class="col">
            <nav class="navbar navbar-expand-lg p-2" data-bs-theme="dark">
              <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation"
              >
                <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav">
                  <!-- primary navigation -->
                  <a class="nav-link" href="../index.html">Home</a>
                  <a class="nav-link" href="./placeholder.html">News</a>
                  <a class="nav-link" href="./placeholder.html"
                    >Taster Modules</a
                  >
                  <a class="nav-link" href="./placeholder.html">Membership</a>
                </div>
              </div>
            </nav>
          </div>
          <div class="col">
            <!-- search box -->
            <form class="d-flex p-2" role="search">
              <input
                class="form-control me-2"
                type="search"
                placeholder="search"
                aria-label="search"
              />
              <button class="btn btn-outline-info" type="submit">Search</button>
            </form>
          </div>
        </div>
      </header>
      <!-- Row 3 -->
      <div class="row mt-2 ms-0">
        <div class="col">
          <nav
            style="--bs-breadcrumb-divider: &quot;>&quot;"
            aria-label="breadcrumb"
          >
            <!-- breadcrumbs -->
            <ol class="breadcrumb">
              <li class="breadcrumb-item active" aria-current="page">Home</li>
            </ol>
          </nav>
        </div>
      </div>
      <!-- page-specific content in sections -->
      <main>
        <!-- Row 4 -->
        <div class="row">
          <div class="container col">
            <section>
              <h2>Announcements</h2>
              <form
                action="https://students.open.ac.uk/mct/tm252/reflect/reflect.php"
                method="post"
              >
                <label for="content">Content:</label><br />
                <input
                  type="text"
                  id="contentInput"
                  name="content"
                  minlength="1"
                />
                <br />

                <label for="subjectLine">Subject line:</label><br />
                <input
                  type="text"
                  id="sLineInput"
                  name="subjectLine"
                  minlength="1"
                /><br />

                <label for="senderName">Sender's name:</label><br />
                <input
                  type="text"
                  id="sNameInput"
                  name="senderName"
                  minlength="1"
                /><br />

                <label for="senderRole">Sender's role:</label><br />
                <input
                  type="text"
                  id="sRoleInput"
                  name="senderRole"
                  minlength="1"
                /><br />

                <label for="moduleLeadAttachment"
                  >Module lead attachment (optional):</label
                ><br />
                <input
                  type="text"
                  id="modLeadAttachInput"
                  name="moduleLeadAttachment"
                /><br />

                <label for="dateTime">Date and time:</label><br />
                <input
                  type="datetime-local"
                  id="dateTimeInput"
                  name="dateTime"
                /><br />

                <label for="priority">Priority:</label><br />
                <input type="radio" id="high" name="priority" value="high" />
                <label for="high">High</label><br />
                <input
                  type="radio"
                  id="normal"
                  name="priority"
                  value="normal"
                />
                <label for="normal">Normal</label><br />
                <input type="radio" id="low" name="priority" value="low" />
                <label for="low">Low</label> <br />

                <input
                  type="hidden"
                  id="itemID"
                  name="item_ID"
                  value="30001000-5000-654321fedcba"
                />

                <input type="submit" value="Submit" />
              </form>
            </section>
          </div>
        </div>
      </main>
      <footer>
        <!-- Row 5 -->
        <div class="row me-0">
          <div class="col">
            <nav class="nav">
              <!-- secondary navigation to go here -->
              <a class="nav-link" href="./placeholder.html">Privacy</a>
              <a class="nav-link" href="./placeholder.html">About Us</a>
              <a class="nav-link" href="./placeholder.html">Support</a>
            </nav>
          </div>
          <div class="col text-end">
            <!-- copyright notice -->
            <p>&copy; EduMax 2024</p>
          </div>
        </div>
      </footer>
    </div>
    <script src="../js/bootstrap.min.js"></script>
    <!-- Bootstrap JavaScript -->
  </body>
</html>
